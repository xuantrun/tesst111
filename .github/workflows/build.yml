name: Build 3105x IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install ldid (for signing)
        run: brew install ldid

      - name: List schemes
        run: |
          xcodebuild -project ThreeOneOSFive.xcodeproj \
            -list 2>&1 || true

      - name: Build (unsigned IPA)
        run: |
          xcodebuild \
            -project ThreeOneOSFive.xcodeproj \
            -scheme ThreeOneOSFive \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            PRODUCT_BUNDLE_IDENTIFIER="com.apple.mobile.MobileHouseArrest" \
            IPHONEOS_DEPLOYMENT_TARGET=16.0 \
            BUILD_DIR="$(pwd)/build" \
            clean build \
            2>&1 | tee build.log

      - name: Package IPA
        run: |
          set -e
          APP_PATH=$(find build -name "*.app" -maxdepth 5 | head -1)
          echo "Found app: $APP_PATH"

          mkdir -p Payload
          cp -R "$APP_PATH" Payload/

          # Fake-sign with ldid
          ldid -S Payload/*.app/$(basename "${APP_PATH%.app}") || true

          zip -r 3105x.ipa Payload
          echo "IPA created: $(du -sh 3105x.ipa)"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: 3105x-ipa
          path: 3105x.ipa
          retention-days: 30

      - name: Create Release with IPA
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "3105x v1.0.${{ github.run_number }}"
          body: |
            ## 3105x — Free Fire Patch Manager

            Build tự động từ commit: ${{ github.sha }}

            ### Cách cài:
            1. Tải file `3105x.ipa` bên dưới
            2. Cài qua ESign hoặc TrollStore (không cần jailbreak)
            3. Sau khi cài, chọn game → bật features → nhấn **INJECT**
            4. Restart Free Fire để kích hoạt

            ### Features: k0-k23 (Wallhack, Aimbot, No Recoil, Speed, ...)
          files: 3105x.ipa
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
