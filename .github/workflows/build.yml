name: Build Dylib

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          git clone https://github.com/theos/theos.git ~/theos
          git -C ~/theos submodule update --init vendor/dm.pl vendor/include vendor/lib vendor/logos vendor/nic vendor/orion vendor/swift-support vendor/templates
          git clone --depth=1 https://github.com/theos/sdks.git ~/theos/sdks
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Build Tweak
        run: |
          export THEOS=~/theos
          make package FINALPACKAGE=1

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BypassLogin-Dylib
          path: |
            packages/*.deb
            .theos/obj/debug/arm64/*.dylib
            .theos/obj/arm64/*.dylib
